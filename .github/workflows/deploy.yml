# Every change saved here goes live at bridgette.pages.dev on its own.
name: Deploy Bridgette
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather the app files
        run: mkdir site && cp _worker.js index.html sw.js manifest.webmanifest icon-192.png icon-512.png site/ && cp -r laptop site/
      - name: Send to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || echo "::error::Token secret is empty"
          # Find the account from the token itself if the saved Account ID is missing or wrong
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -s https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> $GITHUB_ENV; export CLOUDFLARE_ACCOUNT_ID
          fi
          echo "::notice::Account ID length ${#CLOUDFLARE_ACCOUNT_ID}, token length ${#CLOUDFLARE_API_TOKEN}"
          v=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -c '{success, status: .result.status, err: .errors}')
          echo "::notice::Token check: $v"
          p=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/bridgette" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -c '{success, name: .result.name, err: .errors}')
          echo "::notice::Project check: $p"
          set -o pipefail
          npx -y wrangler@3 pages deploy site --project-name=bridgette --branch=main 2>&1 | tee out.txt || { grep -iE "error|✘|denied|auth|not found" out.txt | head -5 | while read -r l; do echo "::error::$l"; done; exit 1; }
